[project]
name = "ddr-public"
description = "Densho Digital Repository"
authors = [
    {name = "Geoffrey Jost", email="geoffrey.jost@densho.us"}
]
maintainers = [
    {name = "Geoffrey Jost", email="geoffrey.jost@densho.us"},
]
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["Django", "repository", "archives",]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
]

dynamic = ["version"]  # will read __version__ from ddrpublic/__init__.py
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4==4.12.3",
    "bpython",
    'django>=6.0,<7.0',                 # MIT
    "django-bootstrap-pagination-forked==1.7.2",
    "django-cors-headers",
    "django-log-request-id",
    "djangorestframework==3.17.1",
    "drf-yasg==1.21.15",
    "django-robots==6.1",
    "gitpython==3.1.50",
    "gunicorn==26.0.0",
    "httpx2==2.0.0",
    "redis==7.4.0",
    "sorl-thumbnail==13.0.0", #>=12.8,<12.9",
    "elastictools @ git+https://github.com/denshoproject/densho-elastictools.git@v1.1.3",
]

[project.optional-dependencies]
testing = []
dev = []

[project.urls]
Repository = "https://github.com/denshoproject/ddr-public"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ['ddrpublic']
